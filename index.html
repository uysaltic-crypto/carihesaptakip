<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Hesap Takip Programı</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f5f5f4;
    color: #1a1a1a;
    margin: 0;
    padding: 24px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .main-nav { display: flex; gap: 8px; margin-bottom: 20px; }
  .main-nav button {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; position: relative;
  }
  .main-nav button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .badge {
    position: absolute; top: -6px; right: -6px; background: #b3261e; color: #fff;
    font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }
  .alert-banner {
    background: #fff4e5; border: 1px solid #f0c98a; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: #8a5a00;
  }
  .alert-banner b { cursor: pointer; text-decoration: underline; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; cursor: pointer; font-size: 14px;
  }
  .tabs button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  input, select, button, textarea {
    font-family: inherit; font-size: 14px; padding: 9px 12px;
    border: 1px solid #ddd; border-radius: 8px; background: #fff;
  }
  button { cursor: pointer; }
  button:hover { background: #f0f0f0; }
  #searchInput { flex: 1; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #eee; }
  .card .label { font-size: 12px; color: #777; margin: 0; }
  .card .value { font-size: 22px; font-weight: 600; margin: 4px 0 0; }
  .acc-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 8px; border-bottom: 1px solid #eee; cursor: pointer; background: #fff;
  }
  .acc-row:hover { background: #fafafa; }
  .acc-row .name { font-weight: 500; font-size: 14px; margin: 0; }
  .acc-row .type { font-size: 12px; color: #777; margin: 2px 0 0; }
  .acc-row .bal { font-weight: 600; font-size: 14px; }
  .pos { color: #1a7d3a; }
  .neg { color: #b3261e; }
  .list-wrap { background: #fff; border-radius: 10px; border: 1px solid #eee; overflow: hidden; }
  .empty { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }
  .detail-card {
    background: #fff; border-radius: 10px; border: 1px solid #eee; padding: 16px 20px; margin-bottom: 20px;
  }
  .detail-head { display: flex; justify-content: space-between; align-items: center; }
  .detail-head .name { font-weight: 600; font-size: 17px; margin: 0; }
  .detail-head .sub { font-size: 13px; color: #777; margin: 4px 0 0; }
  .detail-head .bal-label { font-size: 12px; color: #777; margin: 0; text-align: right; }
  .detail-head .bal-value { font-size: 20px; font-weight: 600; margin: 2px 0 0; text-align: right; }
  .detail-actions { display: flex; gap: 8px; margin-top: 14px; }
  
  .tx-form { display: grid; grid-template-columns: 95px 1.2fr 90px 95px 85px 85px 95px 36px; gap: 6px; margin-bottom: 14px; }
  .tx-row {
    display: grid; grid-template-columns: 95px 1.2fr 90px 95px 85px 85px 95px 36px 36px; gap: 6px;
    padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; align-items: center;
  }
  .tx-row .amt { text-align: right; }
  .tx-row button { border: none; background: none; color: #b3261e; padding: 0; font-size: 15px; }
  .back-btn { margin-bottom: 16px; background: none; border: 1px solid #ddd; }
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 10;
  }
  .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; }
  .modal-box h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
  .modal-box .field-group { display: flex; flex-direction: column; gap: 8px; }
  .modal-box .actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .primary-btn { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .primary-btn:hover { background: #333; }

  .rem-form { display: grid; grid-template-columns: 120px 1fr 100px 120px 90px 110px 80px; gap: 8px; margin-bottom: 16px; }
  .rem-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-bottom: 1px solid #eee; background: #fff; gap: 10px;
  }
  .rem-row.overdue { background: #fff4e5; }
  .rem-row.done { opacity: 0.5; }
  .rem-left { display: flex; align-items: center; gap: 10px; }
  .rem-date { font-size: 12px; color: #777; min-width: 90px; }
  .rem-desc { font-size: 14px; }
  .rem-desc .rem-acc { font-size: 12px; color: #777; display: block; margin-top: 2px; }
  .rem-actions { display: flex; gap: 6px; }
  .rem-actions button { padding: 5px 10px; font-size: 12px; }
  .rem-amt { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .done-text { text-decoration: line-through; }

  .veh-card {
    background: #fff; border-radius: 10px; border: 1px solid #eee; padding: 14px 18px; margin-bottom: 12px;
  }
  .veh-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .veh-head .name { font-weight: 600; font-size: 15px; margin: 0; }
  .veh-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 8px; font-size: 13px; }
  .veh-grid .item .lbl { color: #777; font-size: 11px; margin: 0; }
  .veh-grid .item .val { margin: 2px 0 0; }
  .veh-actions { display: flex; gap: 8px; }
  .veh-actions button { padding: 5px 10px; font-size: 12px; }
  
  .perkm-row { display: flex; align-items: center; gap: 3px; margin-bottom: 8px; }
  .driver-card {
    background: #fff; border-radius: 10px; border: 1px solid #eee; padding: 14px 18px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .driver-card .name { font-weight: 600; font-size: 15px; margin: 0; }
  .driver-card .sub { font-size: 13px; color: #777; margin: 4px 0 0; }

  @media (max-width: 720px) {
    body { padding: 12px; }
    h1 { font-size: 18px; text-align: center; }
    .main-nav { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .main-nav button { flex: 0 0 auto; white-space: nowrap; padding: 10px 14px; font-size: 13px; }
    .tabs { flex-wrap: wrap; }
    .tabs button { flex: 1 1 45%; }
    .toolbar { flex-wrap: wrap; }
    .toolbar button, .toolbar input { width: 100%; }
    .rem-form, .tx-form, .veh-grid { grid-template-columns: 1fr !important; }
    .summary { grid-template-columns: 1fr 1fr; }
    input, select, button, textarea { font-size: 16px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h1 style="margin:0;">Cari hesap takip programı</h1>
    <div style="display:flex; gap:8px;">
      <button id="storageBtn">💾 Depolama</button>
      <button id="gdriveBtn">☁️ Google Drive</button>
      <button id="exportBtn">Yedek indir</button>
      <button id="importBtn">Yedekten yükle</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;" />
    </div>
  </div>

  <div class="main-nav">
    <button class="navBtn active" data-view="cariler">Cariler</button>
    <button class="navBtn" data-view="hatirlaticilar">Hatırlatıcılar<span class="badge" id="remBadge" style="display:none;"></span></button>
    <button class="navBtn" data-view="araclar">Araçlar</button>
    <button class="navBtn" data-view="yakit">Yakıt Girişi</button>
    <button class="navBtn" data-view="soforler">Şoförler</button>
    <button class="navBtn" data-view="seferler">Sefer Ekle</button>
    <button class="navBtn" data-view="sefertanimlari">Sefer Tanımları</button>
    <button class="navBtn" data-view="irsaliye">İrsaliye Takip</button>
  </div>

  <div id="alertBanner" style="display:none;"></div>

  <div id="carilerView">
    <div class="tabs">
      <button class="tabBtn" data-tab="hepsi">Tümü</button>
      <button class="tabBtn" data-tab="musteri">Müşteriler</button>
      <button class="tabBtn" data-tab="tedarikci">Tedarikçiler</button>
      <button class="tabBtn" data-tab="ortak">Ortaklar</button>
      <button class="tabBtn" data-tab="sofor">Şoför Carileri</button>
    </div>

    <div id="listView">
      <div class="toolbar">
        <input id="searchInput" placeholder="Cari ara..." />
        <button id="newAccBtn" class="primary-btn">+ Yeni cari</button>
      </div>
      <div class="summary" id="summaryCards"></div>
      <div class="list-wrap" id="accList"></div>
    </div>

    <div id="detailView" style="display:none;">
      <button class="back-btn" id="backBtn">&larr; Geri</button>
      <div class="detail-card">
        <div class="detail-head">
          <div>
            <p class="name" id="detName"></p>
            <p class="sub" id="detSub"></p>
          </div>
          <div>
            <p class="bal-label">Bakiye</p>
            <p class="bal-value" id="detBalance"></p>
          </div>
        </div>
        <div class="detail-actions">
          <button id="editAccBtn">Düzenle</button>
          <button id="delAccBtn">Cariyi sil</button>
          <button id="addRemFromAccBtn">+ Hatırlatıcı ekle</button>
        </div>
      </div>

      <p style="font-weight:600; font-size:15px; margin-bottom:8px;">Hareketler</p>
      
      <!-- Cari Hareket Ekleme Formu (İrsaliye ve Araç Sütunlu) -->
      <div class="tx-form">
        <input type="date" id="txDate" />
        <input type="text" id="txDesc" placeholder="Açıklama" />
        <input type="text" id="txIrsaliye" placeholder="İrsaliye No" />
        <input type="text" id="txVehicle" list="txVehicleDatalist" placeholder="Araç Plakası" autocomplete="off" />
        <datalist id="txVehicleDatalist"></datalist>
        <input type="number" id="txDebit" placeholder="Borç" min="0" step="0.01" />
        <input type="number" id="txCredit" placeholder="Alacak" min="0" step="0.01" />
        <input type="date" id="txDueDate" title="Son ödeme günü" />
        <button id="addTxBtn" class="primary-btn">+</button>
      </div>
      
      <!-- Hareket Tablosu Başlığı -->
      <div style="display:grid; grid-template-columns: 95px 1.2fr 90px 95px 85px 85px 95px 36px 36px; gap:6px; padding:0 12px; font-size:11px; color:#999; font-weight:600;">
        <span>Tarih</span><span>Açıklama</span><span>İrsaliye</span><span>Araç</span><span style="text-align:right;">Borç</span><span style="text-align:right;">Alacak</span><span style="text-align:right;">Bakiye</span><span></span><span></span>
      </div>
      
      <div class="list-wrap" id="txList" style="padding:0 12px;"></div>
    </div>
  </div>

  <!-- Diğer görünümler (hatırlatıcılar, araçlar vb. şimdilik temel yapıda tutulmuştur) -->
  <div id="hatirlaticilarView" style="display:none;"></div>
  <div id="araclarView" style="display:none;"></div>
  <div id="yakitView" style="display:none;"></div>
  <div id="soforlerView" style="display:none;"></div>
  <div id="seferlerView" style="display:none;"></div>
  <div id="sefertanimlariView" style="display:none;"></div>
  <div id="irsaliyeView" style="display:none;"></div>
</div>

<!-- Düzenleme Modalları -->
<div class="modal-overlay" id="txModalOverlay">
  <div class="modal-box" style="width:360px;">
    <h3>Hareketi düzenle</h3>
    <div class="field-group">
      <input type="date" id="txEditDate" />
      <input type="text" id="txEditDesc" placeholder="Açıklama" />
      <input type="text" id="txEditIrsaliye" placeholder="İrsaliye No" />
      <input type="text" id="txEditVehicle" list="txEditVehicleDatalist" placeholder="Araç Plakası" autocomplete="off" />
      <datalist id="txEditVehicleDatalist"></datalist>
      <input type="number" id="txEditDebit" placeholder="Borç" min="0" step="0.01" />
      <input type="number" id="txEditCredit" placeholder="Alacak" min="0" step="0.01" />
      <input type="date" id="txEditDueDate" />
    </div>
    <div class="actions">
      <button id="txEditCancel">Vazgeç</button>
      <button id="txEditSave" class="primary-btn">Kaydet</button>
    </div>
  </div>
</div>

<script>
  // Basit bir örnek veri saklama ve işleme mantığı altyapısı
  let state = {
    accounts: JSON.parse(localStorage.getItem('cariler_accounts')) || [],
    vehicles: JSON.parse(localStorage.getItem('cariler_vehicles')) || []
  };

  function saveState() {
    localStorage.setItem('cariler_accounts', JSON.stringify(state.accounts));
  }

  // Navigasyon geçişleri ve temel olaylar eklenebilir.
  document.querySelectorAll('.main-nav button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.main-nav button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const view = e.target.getAttribute('data-view');
      document.getElementById('carilerView').style.display = (view === 'cariler') ? 'block' : 'none';
    });
  });
</script>
</body>
</html>
